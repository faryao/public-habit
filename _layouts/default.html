<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b766e">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Public Habit home">
        <span class="brand-mark" aria-hidden="true">✓</span>
        <span>
          <strong>{{ site.title }}</strong>
          <small>Daily evidence, kept in public</small>
        </span>
      </a>
      <a class="github-link" href="https://github.com/{{ site.github_username }}/{{ site.repository_name }}" target="_blank" rel="noreferrer">Repository ↗</a>
    </header>

    <main>{{ content }}</main>

    <footer class="site-footer">
      <span>Built from Markdown on GitHub Pages.</span>
      <span>© <span id="year">{{ site.time | date: '%Y' }}</span> {{ site.author }}</span>
    </footer>

    <script src="{{ '/assets/app.js' | relative_url }}" defer></script>
  </body>
</html>
